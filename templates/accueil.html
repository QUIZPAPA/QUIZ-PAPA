<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUIZ QUIZZZ QUIZZZZZ</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
padding:0;
background:linear-gradient(135deg,#95F5A6,#B0F7FF);
font-family:'Fredoka',sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* INTRO */

#introScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#95F5A6,#B0F7FF);
display:flex;
justify-content:center;
align-items:center;
font-size:48px;
font-weight:600;
z-index:9999;
animation:introAnim 1.8s ease forwards;
}

@keyframes introAnim{

0%{
opacity:0;
transform:scale(0.7);
}

40%{
opacity:1;
transform:scale(1.1);
}

70%{
transform:scale(1);
}

100%{
opacity:0;
}

}

/* CARTE */

.card{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
width:90%;
max-width:420px;
animation:fadeIn 0.8s ease-in-out;
}

.topzone{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin-bottom:15px;
}

.logo{
width:110px;
animation:float 3s ease-in-out infinite;
}

.listenBtn{
font-size:20px;
padding:14px 18px;
border-radius:14px;
border:none;
background:#ffd34d;
cursor:pointer;
font-family:'Fredoka',sans-serif;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.listenBtn:hover{
transform:scale(1.08);
}

h1{
margin-bottom:10px;
}

.info{
font-size:14px;
color:#555;
margin-bottom:20px;
}

select{
width:100%;
padding:12px;
font-size:16px;
border-radius:10px;
border:2px solid #70d5ff;
margin-bottom:15px;
font-family:'Fredoka',sans-serif;
}

.startBtn{
width:100%;
font-size:18px;
padding:16px;
border-radius:12px;
border:none;
background:#70d5ff;
color:white;
cursor:pointer;
transition:all 0.3s ease;
font-family:'Fredoka',sans-serif;
margin-top:20px;
}

.startBtn:hover{
background:#4cc7ff;
transform:scale(1.05);
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-10px)}
100%{transform:translateY(0)}
}

@keyframes fadeIn{
from{opacity:0;transform:scale(0.9)}
to{opacity:1;transform:scale(1)}
}

</style>

<script>

/* VOIX */

function parler(texte){

speechSynthesis.cancel()

let msg=new SpeechSynthesisUtterance(texte)

msg.lang="fr-FR"
msg.rate=0.95
msg.pitch=1

speechSynthesis.speak(msg)

}

/* INSTRUCTIONS */

function lireInstructions(){

parler(
"Bienvenue dans le quiz. Sélectionne d'abord ta classe, puis ta matière et enfin ton thème. Passe la souris sur les réponses pour les entendre. Sur tablette, maintiens ton doigt sur un bouton pour écouter les propositions."
)

}

/* LECTURE CLASSE */

function lireClasse(){

let select=document.getElementById("classe")

if(select.value){

parler("Classe sélectionnée : "+select.options[select.selectedIndex].text)

}

}

/* LECTURE MATIERE */

function lireMatiere(){

let select=document.getElementById("matiere")

if(select.value){

parler("Matière sélectionnée : "+select.options[select.selectedIndex].text)

}

}

/* LECTURE THEME */

function lireTheme(){

let select=document.getElementById("theme")

if(select.value){

parler("Thème sélectionné : "+select.options[select.selectedIndex].text)

}

}

/* LECTURE BOUTON */

function lireBouton(){

parler("Commencer le quiz")

}

/* INTRO + LECTURE */

window.onload=function(){

setTimeout(()=>{

document.getElementById("introScreen").style.display="none"

lireInstructions()

},1800)

}

/* CONSTRUCTION CLASSE -> MATIERE -> THEME */

function construireMenus(){

let donnees={{ matieres | tojson }}

let classes={}

/*
Les fichiers ont la forme :

Matiere Classe - Theme

Exemple :
Svt 6ème - L'alimentation humaine - Copie
*/

for(let matiere in donnees){

donnees[matiere].forEach(function(theme){

let morceaux=theme.split(" ")

if(morceaux.length<2){
return
}

let classe=morceaux[1]

if(!classes[classe]){
classes[classe]={}
}

if(!classes[classe][matiere]){
classes[classe][matiere]=[]
}

classes[classe][matiere].push(theme)

})

}

let classeSelect=document.getElementById("classe")

let matiereSelect=document.getElementById("matiere")

let themeSelect=document.getElementById("theme")

/* CLASSES */

Object.keys(classes).sort().forEach(function(classe){

let option=document.createElement("option")

option.value=classe
option.textContent=classe

classeSelect.appendChild(option)

})

/* CHANGEMENT DE CLASSE */

classeSelect.addEventListener("change",function(){

let classe=this.value

matiereSelect.innerHTML="<option value=''>Choisir une matière</option>"
themeSelect.innerHTML="<option value=''>Choisir un thème</option>"

matiereSelect.disabled=true
themeSelect.disabled=true

if(classes[classe]){

Object.keys(classes[classe]).sort().forEach(function(matiere){

let option=document.createElement("option")

option.value=matiere
option.textContent=matiere

matiereSelect.appendChild(option)

})

matiereSelect.disabled=false

}

})

/* CHANGEMENT DE MATIERE */

matiereSelect.addEventListener("change",function(){

let classe=classeSelect.value
let matiere=this.value

themeSelect.innerHTML="<option value=''>Choisir un thème</option>"

themeSelect.disabled=true

if(classes[classe] && classes[classe][matiere]){

classes[classe][matiere].forEach(function(theme){

let option=document.createElement("option")

option.value=theme

/*
On enlève :
Matiere Classe -
pour n'afficher que le nom du thème.
*/

let nomTheme=theme

let prefix=matiere+" "+classe+" - "

if(nomTheme.startsWith(prefix)){

nomTheme=nomTheme.substring(prefix.length)

}

option.textContent=nomTheme

themeSelect.appendChild(option)

})

themeSelect.disabled=false

}

})

}

</script>

</head>

<body>

<div id="introScreen">
🎯 QUIZ QUIZZZ QUIZZZZZ
</div>

<div class="card">

<div class="topzone">

<img src="{{ url_for('static', filename='images/logo.png') }}" class="logo">

<button
class="listenBtn"
onclick="lireInstructions()"
onmouseover="parler('Écouter les instructions')"
>
🔊 Instructions
</button>

</div>

<h1>🎯 Choisis ton quiz</h1>

<p class="info">
Choisis d'abord ta classe, puis ta matière et enfin ton thème.
</p>

<form method="post" action="/start">

<select
id="classe"
required
onchange="lireClasse()"
>
<option value="">Choisir une classe</option>
</select>

<select
id="matiere"
required
disabled
onchange="lireMatiere()"
>
<option value="">Choisir une matière</option>
</select>

<select
id="theme"
name="theme"
required
disabled
onchange="lireTheme()"
>
<option value="">Choisir un thème</option>
</select>

<button
class="startBtn"
type="submit"
onmouseover="lireBouton()"
ontouchstart="lireBouton()"
>
🚀 Commencer le quiz
</button>

</form>

</div>

<script>

construireMenus()

</script>

</body>
</html>
