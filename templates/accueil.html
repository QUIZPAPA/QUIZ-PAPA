```html
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QUIZ QUIZZZ QUIZZZZZ</title>

<link
href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap"
rel="stylesheet"
>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
padding:20px;

background:linear-gradient(
135deg,
#95F5A6,
#B0F7FF
);

font-family:'Fredoka',sans-serif;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

overflow-x:hidden;

}

/* INTRO */

#introScreen{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:linear-gradient(
135deg,
#95F5A6,
#B0F7FF
);

display:flex;
justify-content:center;
align-items:center;

font-size:48px;
font-weight:600;

z-index:9999;

animation:introAnim 1.8s ease forwards;

}

@keyframes introAnim{

0%{
opacity:0;
transform:scale(0.7);
}

40%{
opacity:1;
transform:scale(1.1);
}

70%{
transform:scale(1);
}

100%{
opacity:0;
}

}

/* CARTE */

.card{

background:white;

padding:35px;

border-radius:20px;

box-shadow:
0 10px 30px rgba(0,0,0,0.2);

text-align:center;

width:100%;
max-width:520px;

animation:fadeIn 0.8s ease-in-out;

}

/* HAUT */

.topzone{

display:flex;

justify-content:center;
align-items:center;

gap:15px;

margin-bottom:15px;

}

.logo{

width:110px;

animation:float 3s ease-in-out infinite;

}

.listenBtn{

font-size:18px;

padding:14px 18px;

border-radius:14px;

border:none;

background:#ffd34d;

cursor:pointer;

font-family:'Fredoka',sans-serif;

box-shadow:
0 4px 10px rgba(0,0,0,0.2);

}

.listenBtn:hover{

transform:scale(1.08);

}

/* TITRE */

h1{

margin:10px 0;

font-size:28px;

}

.info{

font-size:14px;

color:#555;

margin-bottom:25px;

line-height:1.5;

}

/* SELECTIONS */

.selectionZone{

display:flex;

flex-direction:column;

gap:12px;

text-align:left;

}

.selectionLabel{

font-size:16px;

font-weight:600;

margin-top:4px;

}

select{

width:100%;

padding:13px;

font-size:17px;

border-radius:10px;

border:2px solid #70d5ff;

font-family:'Fredoka',sans-serif;

background:white;

cursor:pointer;

}

select:disabled{

background:#eeeeee;

color:#888;

cursor:not-allowed;

}

/* BOUTON */

.startBtn{

width:100%;

font-size:19px;

padding:16px;

border-radius:12px;

border:none;

background:#70d5ff;

color:white;

cursor:pointer;

transition:all 0.3s ease;

font-family:'Fredoka',sans-serif;

margin-top:20px;

}

.startBtn:hover{

background:#4cc7ff;

transform:scale(1.05);

}

.startBtn:disabled{

background:#bdbdbd;

cursor:not-allowed;

transform:none;

}

/* ANIMATIONS */

@keyframes float{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0);
}

}

@keyframes fadeIn{

from{

opacity:0;
transform:scale(0.9);

}

to{

opacity:1;
transform:scale(1);

}

}

/* TABLETTE */

@media(max-width:700px){

body{

padding:15px;

align-items:flex-start;

}

.card{

margin-top:15px;

padding:25px;

}

.logo{

width:90px;

}

h1{

font-size:25px;

}

}

/* TELEPHONE */

@media(max-width:450px){

body{

padding:10px;

}

.card{

padding:20px 16px;

}

.topzone{

gap:10px;

}

.logo{

width:80px;

}

.listenBtn{

font-size:16px;

padding:11px 13px;

}

h1{

font-size:23px;

}

.info{

font-size:13px;

}

select{

font-size:16px;

padding:12px;

}

.startBtn{

font-size:18px;

}

}

</style>

<script>

/* =========================
   VOIX
========================= */

function parler(texte){

if(!("speechSynthesis" in window)){
return;
}

speechSynthesis.cancel();

let msg=new SpeechSynthesisUtterance(texte);

msg.lang="fr-FR";
msg.rate=0.95;
msg.pitch=1;

speechSynthesis.speak(msg);

}


/* =========================
   INSTRUCTIONS
========================= */

function lireInstructions(){

parler(
"Bienvenue dans le quiz. Commence par choisir ta classe. Ensuite, choisis une matière, puis un thème."
);

}


/* =========================
   LECTURE CLASSE
========================= */

function lireClasse(){

let select=document.getElementById("classe");

if(select.selectedIndex<=0){
return;
}

let classe=
select.options[select.selectedIndex].text;

parler(
"Classe sélectionnée : "+classe
);

}


/* =========================
   LECTURE MATIERE
========================= */

function lireMatiere(){

let select=document.getElementById("matiere");

if(select.selectedIndex<=0){
return;
}

let matiere=
select.options[select.selectedIndex].text;

parler(
"Matière sélectionnée : "+matiere
);

}


/* =========================
   LECTURE THEME
========================= */

function lireTheme(){

let select=document.getElementById("themes");

if(select.selectedIndex<=0){
return;
}

let theme=
select.options[select.selectedIndex].text;

parler(
"Thème sélectionné : "+theme
);

}


/* =========================
   LECTURE BOUTON
========================= */

function lireBouton(){

parler(
"Commencer le quiz"
);

}


/* =========================
   DONNEES DES THEMES
========================= */

const themes =
{{ themes | tojson }};


/* =========================
   CONSTRUCTION CLASSE
   MATIERE
   THEME
========================= */

const organisation={};


/*
On analyse les noms de fichiers.

Exemple :

Svt 6ème - L'alimentation humaine - Copie

devient :

Classe : 6ème
Matière : Svt
Thème : L'alimentation humaine - Copie
*/

themes.forEach(function(theme){

let morceaux=
theme.split(" - ");

if(morceaux.length<2){
return;
}


/* Première partie : matière + classe */

let premierePartie=
morceaux[0].trim();


/* Recherche de la classe */

let correspondance=
premierePartie.match(
/\b(6ème|5ème|4ème|3ème|6e|5e|4e|3e)\b/i
);

if(!correspondance){
return;
}


/* Normalisation de la classe */

let classeBrute=
correspondance[1].toLowerCase();

let classes={
"6e":"6ème",
"5e":"5ème",
"4e":"4ème",
"3e":"3ème",
"6ème":"6ème",
"5ème":"5ème",
"4ème":"4ème",
"3ème":"3ème"
};

let classe=
classes[classeBrute];


/* Matière */

let matiere=
premierePartie
.replace(correspondance[0],"")
.trim();


/* Thème */

let themeNom=
morceaux.slice(1).join(" - ").trim();


/* Création des niveaux */

if(!organisation[classe]){
organisation[classe]={};
}

if(!organisation[classe][matiere]){
organisation[classe][matiere]=[];
}


/* On conserve le nom original */

organisation[classe][matiere].push({
nom:themeNom,
valeur:theme
});

});


/* =========================
   ELEMENTS HTML
========================= */

function remplirClasses(){

let select=
document.getElementById("classe");

let ordre=[
"6ème",
"5ème",
"4ème",
"3ème"
];

ordre.forEach(function(classe){

if(organisation[classe]){

let option=
document.createElement("option");

option.value=classe;
option.textContent=classe;

select.appendChild(option);

}

});

}


/* =========================
   CHANGEMENT DE CLASSE
========================= */

function changerClasse(){

let classeSelect=
document.getElementById("classe");

let matiereSelect=
document.getElementById("matiere");

let themeSelect=
document.getElementById("themes");

let classe=
classeSelect.value;


/* Reset matière */

matiereSelect.innerHTML=
"<option value=''>Choisir une matière</option>";

matiereSelect.disabled=true;


/* Reset thème */

themeSelect.innerHTML=
"<option value=''>Choisir un thème</option>";

themeSelect.disabled=true;


/* Désactivation du bouton */

document.getElementById("startBtn").disabled=true;


if(!classe || !organisation[classe]){
return;
}


/* Matières disponibles */

let matieres=
Object.keys(
organisation[classe]
).sort(function(a,b){

return a.localeCompare(
b,
"fr",
{numeric:true}
);

});


matieres.forEach(function(matiere){

let option=
document.createElement("option");

option.value=matiere;
option.textContent=matiere;

matiereSelect.appendChild(option);

});


matiereSelect.disabled=false;

}


/* =========================
   CHANGEMENT DE MATIERE
========================= */

function changerMatiere(){

let classe=
document.getElementById("classe").value;

let matiere=
document.getElementById("matiere").value;

let themeSelect=
document.getElementById("themes");


/* Reset */

themeSelect.innerHTML=
"<option value=''>Choisir un thème</option>";

themeSelect.disabled=true;

document.getElementById("startBtn").disabled=true;


if(
!classe ||
!matiere ||
!organisation[classe] ||
!organisation[classe][matiere]
){

return;

}


/* Thèmes */

let themesDisponibles=
organisation[classe][matiere];


themesDisponibles.forEach(function(theme){

let option=
document.createElement("option");

option.value=
theme.valeur;

option.textContent=
theme.nom;

themeSelect.appendChild(option);

});


themeSelect.disabled=false;

}


/* =========================
   CHANGEMENT DE THEME
========================= */

function changerTheme(){

let theme=
document.getElementById("themes").value;

let bouton=
document.getElementById("startBtn");


bouton.disabled=
!theme;

}


/* =========================
   INITIALISATION
========================= */

window.onload=function(){

remplirClasses();


setTimeout(function(){

let intro=
document.getElementById("introScreen");

if(intro){
intro.style.display="none";
}

lireInstructions();

},1800);

};

</script>

</head>


<body>


<div id="introScreen">

QUIZ QUIZZZ QUIZZZZZ

</div>


<div class="card">


<div class="topzone">

<img
src="{{ url_for('static', filename='images/logo.png') }}"
class="logo"
>

<button
class="listenBtn"
onclick="lireInstructions()"
onmouseover="parler('Écouter les instructions')"
>

Instructions

</button>

</div>


<h1>

Sélectionne ton quiz

</h1>


<p class="info">

Commence par choisir ta classe.<br>
Puis choisis une matière et enfin un thème.

</p>


<form
method="post"
action="/start"
>


<div class="selectionZone">


<label
class="selectionLabel"
for="classe"
>

1. Choisis ta classe

</label>


<select
id="classe"
onchange="lireClasse(); changerClasse()"
required
>

<option value="">

Choisir une classe

</option>

</select>


<label
class="selectionLabel"
for="matiere"
>

2. Choisis une matière

</label>


<select
id="matiere"
onchange="lireMatiere(); changerMatiere()"
disabled
required
>

<option value="">

Choisir une matière

</option>

</select>


<label
class="selectionLabel"
for="themes"
>

3. Choisis un thème

</label>


<select
id="themes"
name="theme"
onchange="lireTheme(); changerTheme()"
disabled
required
>

<option value="">

Choisir un thème

</option>

</select>


</div>


<button
class="startBtn"
id="startBtn"
type="submit"
disabled
onmouseover="lireBouton()"
ontouchstart="lireBouton()"
>

Commencer le quiz

</button>


</form>


</div>


</body>

</html>
```
