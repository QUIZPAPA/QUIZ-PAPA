```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUIZ QUIZZZ QUIZZZZZ</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
padding:0;
background:linear-gradient(135deg,#95F5A6,#B0F7FF);
font-family:'Fredoka',sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* INTRO */

#introScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#95F5A6,#B0F7FF);
display:flex;
justify-content:center;
align-items:center;
font-size:48px;
font-weight:600;
z-index:9999;
animation:introAnim 1.8s ease forwards;
}

@keyframes introAnim{

0%{
opacity:0;
transform:scale(0.7);
}

40%{
opacity:1;
transform:scale(1.1);
}

70%{
transform:scale(1);
}

100%{
opacity:0;
}

}

/* CARTE */

.card{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
width:90%;
max-width:420px;
animation:fadeIn 0.8s ease-in-out;
}

.topzone{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin-bottom:15px;
}

.logo{
width:110px;
animation:float 3s ease-in-out infinite;
}

.listenBtn{
font-size:20px;
padding:14px 18px;
border-radius:14px;
border:none;
background:#ffd34d;
cursor:pointer;
font-family:'Fredoka',sans-serif;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.listenBtn:hover{
transform:scale(1.08);
}

h1{
margin-bottom:10px;
}

.info{
font-size:14px;
color:#555;
margin-bottom:20px;
}

select{
width:100%;
padding:12px;
font-size:16px;
border-radius:10px;
border:2px solid #70d5ff;
margin-bottom:25px;
font-family:'Fredoka',sans-serif;
}

.startBtn{
width:100%;
font-size:18px;
padding:16px;
border-radius:12px;
border:none;
background:#70d5ff;
color:white;
cursor:pointer;
transition:all 0.3s ease;
font-family:'Fredoka',sans-serif;
margin-top:20px;
}

.startBtn:hover{
background:#4cc7ff;
transform:scale(1.05);
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-10px)}
100%{transform:translateY(0)}
}

@keyframes fadeIn{
from{opacity:0;transform:scale(0.9)}
to{opacity:1;transform:scale(1)}
}

</style>

<script>

/* VOIX */

function parler(texte){

speechSynthesis.cancel()

let msg=new SpeechSynthesisUtterance(texte)

msg.lang="fr-FR"
msg.rate=0.95
msg.pitch=1

speechSynthesis.speak(msg)

}

/* INSTRUCTIONS */

function lireInstructions(){

parler(
"Bienvenue dans le quiz. Sélectionne d'abord ta classe, puis ta matière et enfin ton thème. Passe la souris sur les réponses pour les entendre. Sur tablette, maintiens ton doigt sur un bouton pour écouter les propositions."
)

}


/* DONNEES DES THEMES */

const themes = {{ themes | tojson }}


/*
Les noms de fichiers suivent le modèle :

Svt 6ème - L'alimentation humaine - Copie.txt
Emc 6ème - La politique Francaise.txt

On construit ici :
Classe → Matière → Thème
*/

let classes = {}

themes.forEach(function(theme){

let nom = theme.replace(/\.txt$/i,"")

let morceaux = nom.split(" - ")

if(morceaux.length < 2){
return
}

let avant = morceaux[0]

let correspondance = avant.match(/^(.+)\s+(6ème|5ème|4ème|3ème)$/i)

if(!correspondance){
return
}

let matiere = correspondance[1]
let classe = correspondance[2]

let nomTheme = morceaux.slice(1).join(" - ")

if(!classes[classe]){
classes[classe] = {}
}

if(!classes[classe][matiere]){
classes[classe][matiere] = []
}

classes[classe][matiere].push({
nom: nomTheme,
fichier: theme
})

})


/* CLASSE */

function chargerClasses(){

let select = document.getElementById("classe")

Object.keys(classes).sort().forEach(function(classe){

let option = document.createElement("option")

option.value = classe
option.textContent = classe

select.appendChild(option)

})

}


/* MATIERE */

function chargerMatieres(){

let classe = document.getElementById("classe").value

let matiereSelect = document.getElementById("matiere")

let themeSelect = document.getElementById("theme")

matiereSelect.innerHTML = "<option value=''>Choisir une matière</option>"

themeSelect.innerHTML = "<option value=''>Choisir un thème</option>"

if(!classe){
return
}

Object.keys(classes[classe]).sort().forEach(function(matiere){

let option = document.createElement("option")

option.value = matiere
option.textContent = matiere

matiereSelect.appendChild(option)

})

}


/* THEME */

function chargerThemes(){

let classe = document.getElementById("classe").value

let matiere = document.getElementById("matiere").value

let themeSelect = document.getElementById("theme")

themeSelect.innerHTML = "<option value=''>Choisir un thème</option>"

if(!classe || !matiere){
return
}

classes[classe][matiere].forEach(function(theme){

let option = document.createElement("option")

option.value = theme.fichier
option.textContent = theme.nom

themeSelect.appendChild(option)

})

}


/* LECTURE DU THEME */

function lireTheme(){

let select = document.getElementById("theme")

if(!select.value){
return
}

let theme = select.options[select.selectedIndex].text

parler("Thème sélectionné : "+theme)

}


/* LECTURE DU BOUTON */

function lireBouton(){

parler("Commencer le quiz")

}


/* DEMARRAGE */

window.onload=function(){

chargerClasses()

setTimeout(()=>{

document.getElementById("introScreen").style.display="none"

lireInstructions()

},1800)

}

</script>

</head>

<body>

<div id="introScreen">
🎯 QUIZ QUIZZZ QUIZZZZZ
</div>

<div class="card">

<div class="topzone">

<img src="{{ url_for('static', filename='images/logo.png') }}" class="logo">

<button
class="listenBtn"
onclick="lireInstructions()"
onmouseover="parler('Écouter les instructions')"
>
🔊 Instructions
</button>

</div>

<h1>🎯 Sélectionne ton quiz</h1>

<p class="info">
Choisis d'abord ta classe, puis ta matière et enfin ton thème.<br>
Passe la souris sur les réponses pour les entendre.<br>
Sur tablette : maintiens ton doigt sur un bouton pour écouter.
</p>

<form method="post" action="/start">

<select
id="classe"
required
onchange="chargerMatieres()"
>
<option value="">Choisir une classe</option>
</select>

<select
id="matiere"
required
onchange="chargerThemes()"
>
<option value="">Choisir une matière</option>
</select>

<select
id="theme"
name="theme"
required
onchange="lireTheme()"
>
<option value="">Choisir un thème</option>
</select>

<button
class="startBtn"
type="submit"
onmouseover="lireBouton()"
ontouchstart="lireBouton()"
>
🚀 Commencer le quiz
</button>

</form>

</div>

</body>
</html>
```
