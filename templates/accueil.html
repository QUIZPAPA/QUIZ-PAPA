<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUIZ QUIZZZ QUIZZZZZ</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    padding:0;
    background:linear-gradient(135deg,#95F5A6,#B0F7FF);
    font-family:'Fredoka',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
    width:90%;
    max-width:420px;
    animation:fadeIn 0.8s ease-in-out;
}

.topzone{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}

.logo{
    width:110px;
    animation:float 3s ease-in-out infinite;
}

.listenBtn{
    font-size:20px;
    padding:14px 18px;
    border-radius:14px;
    border:none;
    background:#ffd34d;
    cursor:pointer;
    font-family:'Fredoka',sans-serif;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.listenBtn:hover{
    transform:scale(1.08);
}

h1{
    margin-bottom:10px;
}

.info{
    font-size:14px;
    color:#555;
    margin-bottom:20px;
}

select{
    width:100%;
    padding:12px;
    font-size:16px;
    border-radius:10px;
    border:2px solid #70d5ff;
    margin-bottom:25px;
    font-family:'Fredoka',sans-serif;
}

.startBtn{
    width:100%;
    font-size:18px;
    padding:16px;
    border-radius:12px;
    border:none;
    background:#70d5ff;
    color:white;
    cursor:pointer;
    transition:all 0.3s ease;
    font-family:'Fredoka',sans-serif;
    margin-top:25px;
}

.startBtn:hover{
    background:#4cc7ff;
    transform:scale(1.05);
}

@keyframes float{
    0%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
    100%{transform:translateY(0)}
}

@keyframes fadeIn{
    from{opacity:0;transform:scale(0.9)}
    to{opacity:1;transform:scale(1)}
}

</style>

<script>

function parler(texte){

    speechSynthesis.cancel();

    let msg=new SpeechSynthesisUtterance(texte);

    msg.lang="fr-FR";
    msg.rate=0.95;

    speechSynthesis.speak(msg);
}


function lireInstructions(){

    parler(
    "Bienvenue dans le quiz. Sélectionne ton thème. Passe la souris sur les réponses pour les entendre. Sur tablette, maintiens ton doigt sur les boutons pour écouter les propositions."
    );
}


function lireTheme(){

    let select=document.getElementById("themes");

    let theme=select.options[select.selectedIndex].text;

    parler("Thème sélectionné : "+theme);
}


function lireBouton(){

    parler("Commencer le quiz");

}

</script>

</head>

<body onload="lireInstructions()">

<div class="card">

<div class="topzone">

<img src="{{ url_for('static', filename='images/logo.png') }}" class="logo">

<button class="listenBtn"
onclick="lireInstructions()"
onmouseover="parler('Écouter les instructions')"
>
🔊 Instructions
</button>

</div>

<h1>🎯 Sélectionne ton thème</h1>

<p class="info">
Passe la souris sur les réponses pour les entendre.<br>
Sur tablette : maintiens ton doigt sur un bouton pour écouter.
</p>

<form method="post" action="/start">

<select id="themes" name="theme" required onchange="lireTheme()">

{% for t in themes %}
<option value="{{ t }}">{{ t }}</option>
{% endfor %}

</select>

<button
class="startBtn"
type="submit"
onmouseover="lireBouton()"
ontouchstart="lireBouton()"
>
🚀 Commencer le quiz
</button>

</form>

</div>

</body>
</html>
